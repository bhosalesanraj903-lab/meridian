name: deploy
on:
  workflow_dispatch: # manual runs from the Actions tab
  pull_request:
    paths: ["infra/**", "lambdas/**", "glue_jobs/**", "src/**", "pyproject.toml"]
  push:
    branches: [main]
    paths: ["infra/**", "lambdas/**", "glue_jobs/**", "src/**", "pyproject.toml"]

permissions:
  id-token: write # OIDC — no long-lived AWS keys anywhere
  contents: read
  pull-requests: write

env:
  TF_DIR: infra/terraform/envs/dev

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Terraform hashes these artifacts (lambda zip, wheels), so they must
      # exist and be reproducible before plan/apply.
      - run: python -m venv .venv && make build-lambdas build-wheel build-wheelhouse
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=$TF_DIR init -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
      - run: terraform -chdir=$TF_DIR plan -no-color -lock=false -var alert_email="${{ vars.ALERT_EMAIL }}"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev # add a required reviewer in repo settings for a manual gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && make build-lambdas build-wheel build-wheelhouse
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=$TF_DIR init -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
      - run: terraform -chdir=$TF_DIR apply -auto-approve -var alert_email="${{ vars.ALERT_EMAIL }}"
