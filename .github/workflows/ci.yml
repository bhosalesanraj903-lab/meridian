name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly slow run: keeps the Splink quality floor (P>0.95/R>0.90)
    # asserted without paying ~1 min of EM training on every PR.
    - cron: "0 3 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,aws]"
      - run: ruff check .
      - name: Fast tests (PR/push)
        if: github.event_name != 'schedule'
        run: pytest -q -m "not slow" tests/
      - name: Full test suite (weekly)
        if: github.event_name == 'schedule'
        run: pytest -q tests/
