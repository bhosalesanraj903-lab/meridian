version: "3.8"

# Meridian local stack — Phase 0
# Start: make up   |   Stop: make down   |   Status: docker compose ps
# Heavy engines (Spark, Flink) run on-demand later; this is the always-on core.

services:
  # Core-banking OLTP source (CDC-ready: wal_level=logical for Debezium)
  corebank-db:
    image: postgres:16
    environment:
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: corebank
      POSTGRES_DB: corebank
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5433:5432"]
    volumes: ["corebank-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebank"]
      interval: 10s
      retries: 5

  # Kafka in KRaft mode (no zookeeper)
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka-data:/bitnami/kafka"]

  # Debezium Kafka Connect (register the corebank connector in Phase 2)
  connect:
    image: debezium/connect:2.7
    depends_on: [kafka, corebank-db]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: meridian-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status

  # MinIO = local S3 (bucket layout mirrors the eventual AWS setup)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: meridian
      MINIO_ROOT_PASSWORD: meridian-dev-secret
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 meridian meridian-dev-secret &&
      mc mb -p local/meridian-bronze local/meridian-silver local/meridian-gold local/meridian-quarantine || true
      "

  # Airflow standalone (dev mode: webserver+scheduler+sqlite in one container)
  airflow:
    image: apache/airflow:2.10.4
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      MERIDIAN_DATA_DIR: /opt/meridian/data
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/meridian/ingestion
      - ./data:/opt/meridian/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: meridian
    volumes: ["grafana-data:/var/lib/grafana"]

volumes:
  corebank-data:
  kafka-data:
  minio-data:
  prom-data:
  grafana-data:
